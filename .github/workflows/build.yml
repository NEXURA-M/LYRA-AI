name: Build and Deploy Secure Web

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Secret URL Securely
        env:
          SECRET_URL: ${{ secrets.URL }}
        run: |
          # URL ko Base64 encode kar rahe hain taaki View Source (Ctrl+U) ya F12 mein direct plain text mein na dikhe
          ENCODED_URL=$(echo -n "$SECRET_URL" | base64)
          
          echo "Encoding and injecting URL..."
          
          # HTML ya JS file mein placeholder ko encoded string se replace karna
          # Maan lijiye aapki file 'index.html' ya 'script.js' hai
          if [ -f "index.html" ]; then
            sed -i "s|__SECURE_URL_PLACEHOLDER__|${ENCODED_URL}|g" index.html
          fi
          
          if [ -f "script.js" ]; then
            sed -i "s|__SECURE_URL_PLACEHOLDER__|${ENCODED_URL}|g" script.js
          fi

      - name: Deploy to GitHub Pages or Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
