name: Build and Securely Frame URL

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject and Obfuscate Secret URL
        env:
          SECRET_URL: ${{ secrets.URL }}
        run: |
          # URL ko Base64 mein encode karna taaki source code mein plain text na dikhe
          ENCODED_URL=$(echo -n "$SECRET_URL" | base64)
          
          echo "Injecting encoded URL into index.html..."
          
          # index.html ke placeholder ko encoded string se replace karna
          if [ -f "index.html" ]; then
            sed -i "s|__SECURE_URL_PLACEHOLDER__|${ENCODED_URL}|g" index.html
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
